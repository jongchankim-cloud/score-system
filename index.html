        </button>
      </div>
    </div>

    <footer>© 용산대성N학원 영어과</footer>

    <script>
      const SUPABASE_URL = "https://rcpzinsdocmpnfxkfbil.supabase.co";
      // 같은 도메인의 /api/parent-login (vercel.json rewrite → Supabase 함수).
      // 세션은 HttpOnly 쿠키라서 JS는 토큰을 다루지 않는다.
      const PARENT_LOGIN_URL = "/api/parent-login";
      // 예전 버전이 저장해 둔 PIN 평문 정보를 지운다
      try { localStorage.removeItem("vocab_auth"); } catch (e) {}

      let currentStudent = null;
      let currentWeeks = [];
      let allScores = [];
      let chartInstance = null;
      let loginData = null; // parent-login이 반환한 전체 데이터 묶음
      let weekConfigMap = {}; // { weekId: 정규화된 항목 설정 배열 }

      // ── 주차별 채점 항목 설정 (admin.html과 동일 규약) ──────────
      // 물리 컬럼이 있는 기본 4슬롯의 key 목록. 5번째 이상 항목은 scores.item_scores(jsonb)에
      // 들어 있어 itemVal()로 읽는다 — 즉 이 배열은 항목 개수 상한이 아니다.
      // ※ 오랫동안 이 파일에서 참조가 없는 죽은 코드였으나, 지금은 아래 LEGACY_ITEM_KEYS가
      //   이 배열을 실제로 사용한다(응답에서 물리 컬럼이 빠졌는지 판정). 지우지 말 것.
      const ITEM_KEYS = [
        "word_score",
        "reading_score",
        "mc_score",
        "item4_score",
      ];
      // 항목 설정이 없는(기존) 주차에만 적용되는 초기값.
      // 저장된 이름이 있으면 항상 그 값을 사용한다 (모든 항목명은 관리자가 직접 입력).
      const DEFAULT_ITEM_CONFIG = [
        { key: "word_score", label: "단어", max: 25, cut: null, active: true },
        {
          key: "reading_score",
          label: "해석",
          max: 30,
          cut: null,
          active: true,
        },
        { key: "mc_score", label: "객관식", max: 45, cut: null, active: true },
        { key: "item4_score", label: "", max: 20, cut: null, active: false },
      ];

      // 모의고사 항목 (mock_scores 컬럼과 1:1). item_config가 없는 기존 모의고사는
      // 예전처럼 '점수' 1개(만점 100)로 동작하고 그 값은 mock_scores.score에 있다.
      const MOCK_ITEM_KEYS = [
        "item1_score",
        "item2_score",
        "item3_score",
        "item4_score",
      ];
      const DEFAULT_MOCK_ITEM_CONFIG = [
        {
          key: "item1_score",
          label: "점수",
          max: 100,
          cut: null,
          active: true,
        },
        { key: "item2_score", label: "", max: null, cut: null, active: false },
        { key: "item3_score", label: "", max: null, cut: null, active: false },
        { key: "item4_score", label: "", max: null, cut: null, active: false },
      ];

      // item_config(JSON, NULL 가능) → 정규화된 항목 배열.
      // ① defaults의 고정 슬롯(물리 컬럼과 1:1, 고정 순서)을 예전과 똑같이 먼저 만들고
      // ② 그 뒤에 defaults에 없는 key(= 5번째 이상 추가 항목)를 저장된 순서대로 이어붙인다.
      // NULL(기존 주차)이면 ②가 비어 예전과 완전히 동일하다 (단어25/해석30/객관식45).
      // ★ admin.html에 같은 함수가 복제돼 있다 — 한쪽만 고치면 관리자/학부모 총점이 조용히 어긋난다.
      function normalizeItemConfig(raw, defaults = DEFAULT_ITEM_CONFIG) {
        const items = raw && Array.isArray(raw.items) ? raw.items : null;
        // def가 있으면 고정 슬롯(기본값 폴백), 없으면 추가 항목(기본값 없음)
        const norm = (s, def) => ({
          key: def ? def.key : s.key,
          label: (s.label ?? (def ? def.label : "") ?? "").toString(),
          max:
            s.max === undefined || s.max === null || s.max === ""
              ? def
                ? def.max
                : null
              : parseFloat(s.max),
          cut:
            s.cut === undefined || s.cut === null || s.cut === ""
              ? null
              : parseFloat(s.cut),
          active:
            s.active === undefined ? (def ? def.active : true) : !!s.active,
        });
        const out = defaults.map((def) => {
          const src = items
            ? items.find((it) => it && it.key === def.key)
            : null;
          return norm(src || def, def);
        });
        // 추가 항목. key가 item_scores와 retest_pass의 키이므로 중복 key는 버린다.
        if (items) {
          const seen = new Set(out.map((it) => it.key));
          items.forEach((src) => {
            if (
              !src ||
              typeof src.key !== "string" ||
              !src.key ||
              seen.has(src.key)
            )
              return;
            seen.add(src.key);
            out.push(norm(src, null));
          });
        }
        return out;
      }

      // 기본 슬롯 key(물리 컬럼과 1:1)를 모아둔다. 응답에 그 컬럼이 통째로 빠졌는지 판정하는 데 쓴다.
      const LEGACY_ITEM_KEYS = new Set([...ITEM_KEYS, ...MOCK_ITEM_KEYS]);

      // 항목 점수 읽기. 1~4번 항목은 물리 컬럼, 5번째 이상은 item_scores(jsonb)에서 꺼낸다.
      // undefined(응답에 컬럼 자체가 없음)와 null(점수 미입력)의 구분이 핵심 —
      // parent-login이 아직 item_scores를 안 내려주면 undefined가 나오고,
      // 호출부의 기존 total_score / score 레거시 폴백이 그대로 작동해 화면이 깨지지 않는다.
      // ★ admin.html에 같은 함수가 복제돼 있다.
      function itemVal(row, key) {
        if (!row) return undefined;
        const bag = row.item_scores;
        if (bag && bag[key] !== undefined) return bag[key]; // jsonb에 값이 있으면 우선
        const v = row[key];
        if (v !== undefined) return v; // 물리 컬럼
        if (bag === undefined) return undefined; // 응답에 jsonb 자체가 없음
        // jsonb는 있는데 key가 없다. 기본 슬롯이면 "응답에서 컬럼이 빠진 것"(→ 레거시 폴백 살림),
        // 추가 항목이면 "아직 점수 미입력"(→ null).
        // parent-login의 명시 select에 item_scores만 추가하고 word_score 등을 빠뜨리면
        // 바로 이 경로를 탄다. 여기서 null을 돌려주면 computeTotal의 total_score 폴백이 죽고
        // canItemBased가 true로 뒤집혀, 콘솔 경고도 없이 총점이 비고 석차 모집단에서 빠진다.
        return LEGACY_ITEM_KEYS.has(key) ? undefined : null;
      }

      // 관리자가 직접 입력한 항목명을 그대로 출력하므로 HTML 이스케이프
      function escapeHtml(str) {
        return (str || "")
          .toString()
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      // 해당 주차의 활성 항목 목록 (설정이 없으면 기본 3항목)
      function itemsForWeek(weekId) {
        const cfg = weekConfigMap[weekId];
        return (cfg || normalizeItemConfig(null)).filter((it) => it.active);
      }

      // 활성 항목 만점 합계 = 그 주차의 총점 만점
      function totalMaxForWeek(weekId) {
        return itemsForWeek(weekId).reduce((a, it) => a + (it.max || 0), 0);
      }

      // 점수 행의 총점 계산: 활성 항목의 입력값 합.
      // 활성 항목 컬럼이 하나라도 응답에 없으면(undefined) 계산이 틀어지므로
      // 계산을 포기하고 기존 total_score로 폴백한다.
      // (일부 컬럼만으로 합산하면 석차가 심각하게 왜곡됨)
      function computeTotal(row, weekId) {
        if (!row) return null;
        const items = itemsForWeek(weekId ?? row.week_id);
        const hasMissingColumn = items.some(
          (it) => itemVal(row, it.key) === undefined,
        );
        if (hasMissingColumn) return row.total_score ?? null;
        const entered = items
          .map((it) => itemVal(row, it.key))
          .filter((v) => v !== null);
        // 컬럼은 모두 있는데 값이 전부 비어있음 → 미응시(null)
        if (!entered.length) return null;
        return entered.reduce((a, b) => a + parseFloat(b), 0);
      }

      async function login() {
        const name = document.getElementById("input-name").value.trim();
        const pin = document.getElementById("input-pin").value.trim();
        const err = document.getElementById("error-msg");
        const load = document.getElementById("login-loading");
        err.classList.remove("show");
        if (!name || !pin) {
          err.textContent = "이름과 PIN을 모두 입력해주세요.";
          err.classList.add("show");
          return;
        }
        load.classList.add("show");
        try {
          const res = await fetch(PARENT_LOGIN_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, pin }),
          });
          if (res.status === 401) {
            err.textContent = "이름 또는 PIN이 올바르지 않습니다.";
            err.classList.add("show");
            return;
          }
          if (!res.ok) {
            err.textContent = "오류가 발생했습니다. 잠시 후 다시 시도해주세요.";
            err.classList.add("show");
            return;
          }
          // 세션은 서버가 준 HttpOnly 쿠키로 유지된다 (새로고침·뒤로 가기·단어 사이트 공유)
          loginData = await res.json();
          currentStudent = loginData.student;
          document.getElementById("input-pin").value = "";
          await showResult();
        } catch (e) {
          err.textContent = "오류가 발생했습니다. 잠시 후 다시 시도해주세요.";
          err.classList.add("show");
        } finally {
          load.classList.remove("show");
        }
      }

      function showChartAndSummary() {
        if (allScores.length > 0) {
          document.getElementById("summary-grid").style.display = "grid";
          document.getElementById("chart-card").style.display = "block";
        }
      }

      function hideChartAndSummary() {
        document.getElementById("summary-grid").style.display = "none";
        document.getElementById("chart-card").style.display = "none";
      }

      async function showResult() {
        document.getElementById("login-section").style.display = "none";
        document.getElementById("result-section").style.display = "block";
        document.getElementById("tab-nav").classList.add("show");
        document.getElementById("result-name").textContent =
          currentStudent.name;
        document.getElementById("result-class").textContent =
          currentStudent.classes?.name || "";

        currentWeeks = loginData.weeks || [];
        allScores = loginData.myScores || [];

        // 주차별 항목 설정 맵 구성 (item_config 없으면 기본값으로 정규화)
        weekConfigMap = {};
        currentWeeks.forEach((w) => {
          weekConfigMap[w.id] = normalizeItemConfig(w.item_config);
        });

        if (allScores.length > 0) {
          const totals = allScores
            .map((s) => computeTotal(s, s.week_id))
            .filter((v) => v !== null);
          const avg = totals.length
            ? (totals.reduce((a, b) => a + b, 0) / totals.length).toFixed(1)
            : "-";
          const best = totals.length ? Math.max(...totals) : "-";
          document.getElementById("cum-avg").textContent =
            avg + (avg !== "-" ? "점" : "");
          document.getElementById("cum-best").textContent =
            best + (best !== "-" ? "점" : "");
          showChartAndSummary();
          renderChart();
        }

        renderPeriodSelector();
        loadClinicBooking();
      }

      // ── 클리닉 신청 (2026-11) ──
      // 같은 도메인의 /api/clinic-book (vercel.json rewrite → Supabase 함수 clinic-book). 로그인 세션 쿠키로 학생을 확인한다.
      // 선생님이 정한 운영 시간 안에서 날짜 · 시 · 분을 고르고 버튼으로 확정한다. 바꾸거나 취소하면 학부모님·선생님께 문자가 간다(처음 신청은 문자 없음).
      const CLINIC_BOOK_URL = "/api/clinic-book";
      let clinicState = null;
      let clinicBusy = false;
      let clinicPick = { date: "", hour: "", minute: "" };   // 고르는 중인 날짜·시·분 — 고르기만 해서는 아무것도 저장되지 않는다

      async function loadClinicBooking() {
        const card = document.getElementById("clinic-book-card");
        try {
          const res = await fetch(CLINIC_BOOK_URL, { method: "GET" });
          if (!res.ok) { card.style.display = "none"; return; }
          clinicState = await res.json();
          clinicPickFromBooking();
          renderClinicBooking();
        } catch (e) {
          card.style.display = "none";   // 신청 기능이 안 돼도 성적 화면은 그대로
        }
      }

      function renderClinicBooking(msg, ok) {
        const card = document.getElementById("clinic-book-card");
        const body = document.getElementById("clinic-book-body");
        const s = clinicState;
        if (!s || !s.enabled) { card.style.display = "none"; return; }
        card.style.display = "block";
        const b = s.booking;
        let html = "";
        if (b) {
          html += `<div class="cb-current">신청한 클리닉<br><b>${escapeHtml(b.label)}</b>${b.past ? " <span style=\"color:var(--gray);font-size:12px\">(시작했거나 지났어요)</span>" : ""}</div>`;
        }
        const slots = s.slots || [];
        // 시험을 모두 통과하고 과제도 기준 이상이면 신청을 받지 않는다(이미 신청했으면 서버가 취소해 둔다)
        if (s.exempt) {
          html += `<div class="cb-exempt">이번 주는 시험을 모두 통과하고 과제도 ${escapeHtml(String(s.exempt.hwMin))}% 이상 해서 클리닉이 없어요. 수고했어요!</div>`;
          if (s.cancelledLabel) html += `<div class="cb-label">신청했던 ${escapeHtml(s.cancelledLabel)} 클리닉은 취소됐어요.</div>`;
          if (msg) html += `<div class="cb-msg ${ok ? "ok" : "err"}">${escapeHtml(msg)}</div>`;
          body.innerHTML = html;
          return;
        }
        if (s.canChange && slots.length) {
          html += `<div class="cb-label">${b ? "다른 시간으로 바꾸려면 날짜 · 시 · 분을 고르고 아래 버튼을 눌러 주세요" : "원하는 날짜 · 시 · 분을 고르고 아래 버튼을 눌러 주세요"}</div>`;
          // 날짜 · 시 · 분을 고른 뒤 아래 버튼을 눌러야 신청·변경된다(잘못 눌러 문자가 가지 않게 — 2026-11 운영 요청)
          const p = clinicPickNormalize();
          const opts = clinicPickOptions(p);
          const sel = (idAttr, list, val, ph, dis) => `<select class="period-select" ${idAttr} ${dis || clinicBusy ? "disabled" : ""} onchange="onClinicPick()">`
            + `<option value="">${ph}</option>${list.map((o) => `<option value="${escapeHtml(o.v)}"${o.v === val ? " selected" : ""}>${escapeHtml(o.t)}</option>`).join("")}</select>`;
          html += `<div class="cb-pick">`
            + sel('id="cb-pick-date" aria-label="날짜"', opts.dates, p.date, "날짜", false)
            + sel('id="cb-pick-hour" aria-label="시"', opts.hours, p.hour, "시", !p.date)
            + sel('id="cb-pick-minute" aria-label="분"', opts.minutes, p.minute, "분", !p.hour)
            + `</div>`;
          const x = clinicPickSlot(p);
          const same = !!(x && b && b.day === x.day && b.time === x.time);
          if (x && !same) html += `<div class="cb-chosen">고른 시간 <b>${escapeHtml(x.label)}</b></div>`;
          html += `<button type="button" class="cb-submit" ${!x || same || clinicBusy ? "disabled" : ""} onclick="submitClinicPick()">`
            + `${!x ? (b ? "바꿀 시간을 골라 주세요" : "시간을 골라 주세요") : same ? "지금 신청한 시간이에요" : b ? "이 시간으로 변경하기" : "이 시간으로 신청하기"}</button>`;
          if (x && b && !same) html += `<div class="cb-warn">변경하면 학부모님과 선생님께 문자가 가요.</div>`;
          if (b) html += `<button type="button" class="cb-cancel" ${clinicBusy ? "disabled" : ""} onclick="cancelClinicBooking()">클리닉 신청 취소</button>`;
        } else if (!b) {
          html += `<div class="cb-label">${s.week ? "지금 고를 수 있는 클리닉 시간이 없어요." : "이번 주 시험 주차가 아직 등록되지 않았어요. 잠시 뒤 다시 확인해 주세요."}</div>`;
        } else if (!s.canChange) {
          html += `<div class="cb-label">시작했거나 지난 클리닉은 바꿀 수 없어요. 필요하면 선생님께 직접 연락해 주세요.</div>`;
        }
        html += `<div class="cb-note">시간을 바꾸거나 취소하면 학부모님과 선생님께 문자로 알려드려요.<br>클리닉 전날 오후 6시에 안내 문자가 가요. 시간은 클리닉 시작 전까지 바꿀 수 있어요.</div>`;
        if (msg) html += `<div class="cb-msg ${ok ? "ok" : "err"}">${escapeHtml(msg)}</div>`;
        body.innerHTML = html;
      }

      async function clinicRequest(method, payload) {
        clinicBusy = true;
        renderClinicBooking("처리 중이에요...", true);
        try {
          const res = await fetch(CLINIC_BOOK_URL, {
            method,
            headers: { "Content-Type": "application/json" },
            body: payload ? JSON.stringify(payload) : undefined,
          });
          const data = await res.json().catch(() => ({}));
          clinicBusy = false;
          if (res.status === 401) { renderClinicBooking("로그인이 만료됐어요. 다시 로그인해 주세요.", false); return null; }
          if (!res.ok) {
            // 서버가 화면 상태를 함께 보냈으면(예: 클리닉 필요 없음) 그 상태로 다시 그린다
            if (data && typeof data.enabled === "boolean") clinicState = data;
            renderClinicBooking(data.message || "처리하지 못했어요. 잠시 후 다시 해 주세요.", false);
            return null;
          }
          clinicState = data;
          return data;
        } catch (e) {
          clinicBusy = false;
          renderClinicBooking("연결이 원활하지 않아요. 잠시 후 다시 해 주세요.", false);
          return null;
        }
      }

      // 서버가 준 slots(시간순)를 날짜('11/23(월)') · 시('15') · 분('30')으로 나눠 본다
      function clinicSlotParts(x) {
        const sp = x.label.indexOf(" ");
        return { date: sp > 0 ? x.label.slice(0, sp) : x.label, hour: x.time.slice(0, 2), minute: x.time.slice(3, 5) };
      }
      function clinicHourText(h) {
        const n = parseInt(h, 10);
        return `${n < 12 ? "오전" : "오후"} ${n % 12 === 0 ? 12 : n % 12}시`;
      }
      // 고른 값이 목록에 없으면(날짜를 바꿔 그 시각이 없는 등) 비운다
      function clinicPickNormalize() {
        const slots = (clinicState && clinicState.slots) || [];
        const parts = slots.map(clinicSlotParts);
        const p = { ...clinicPick };
        if (!parts.some((q) => q.date === p.date)) p.date = "";
        if (!parts.some((q) => q.date === p.date && q.hour === p.hour)) p.hour = "";
        if (!parts.some((q) => q.date === p.date && q.hour === p.hour && q.minute === p.minute)) p.minute = "";
        clinicPick = p;
        return p;
      }
      function clinicPickOptions(p) {
        const parts = ((clinicState && clinicState.slots) || []).map(clinicSlotParts);
        const uniq = (arr) => arr.filter((v, i) => arr.indexOf(v) === i);
        return {
          dates: uniq(parts.map((q) => q.date)).map((d) => ({ v: d, t: d })),
          hours: uniq(parts.filter((q) => q.date === p.date).map((q) => q.hour)).map((h) => ({ v: h, t: clinicHourText(h) })),
          minutes: uniq(parts.filter((q) => q.date === p.date && q.hour === p.hour).map((q) => q.minute)).map((m) => ({ v: m, t: `${m}분` })),
        };
      }
      function clinicPickSlot(p) {
        const slots = (clinicState && clinicState.slots) || [];
        return slots.find((x) => { const q = clinicSlotParts(x); return q.date === p.date && q.hour === p.hour && q.minute === p.minute; }) || null;
      }
      // 신청한 시간이 있으면 그 시간으로 맞춰 둔다(고르던 값이 없을 때만)
      function clinicPickFromBooking() {
        const s = clinicState, b = s && s.booking;
        const x = b && ((s.slots || []).find((y) => y.day === b.day && y.time === b.time));
        clinicPick = x ? clinicSlotParts(x) : { date: "", hour: "", minute: "" };
      }
      function onClinicPick() {
        const d = document.getElementById("cb-pick-date").value;
        const h = document.getElementById("cb-pick-hour").value;
        const m = document.getElementById("cb-pick-minute").value;
        const dateChanged = d !== clinicPick.date, hourChanged = h !== clinicPick.hour;
        clinicPick = { date: d, hour: dateChanged ? "" : h, minute: dateChanged || hourChanged ? "" : m };
        // 고를 것이 하나뿐이면 미리 채워 준다
        const o = clinicPickOptions(clinicPick);
        if (clinicPick.date && !clinicPick.hour && o.hours.length === 1) clinicPick.hour = o.hours[0].v;
        const o2 = clinicPickOptions(clinicPick);
        if (clinicPick.hour && !clinicPick.minute && o2.minutes.length === 1) clinicPick.minute = o2.minutes[0].v;
        renderClinicBooking();
      }

      // 신청은 문자가 없어 버튼으로 바로, 변경은 학부모·선생님께 문자가 가므로 한 번 더 확인한다
      async function submitClinicPick() {
        const s = clinicState;
        const x = clinicPickSlot(clinicPick);
        if (!s || !x || clinicBusy) return;
        const before = s.booking ? s.booking.label : null;
        if (before && s.booking.day === x.day && s.booking.time === x.time) return;
        if (before && !confirm(`클리닉 시간을 바꿀까요?\n${before} → ${x.label}\n\n학부모님과 선생님께 문자가 갑니다.`)) return;
        const r = await clinicRequest("POST", { day: x.day, time: x.time });
        if (r) { clinicPickFromBooking(); renderClinicBooking(before ? `클리닉 시간을 바꿨어요: ${x.label}` : `클리닉을 신청했어요: ${x.label}`, true); }
      }

      async function cancelClinicBooking() {
        const s = clinicState;
        if (!s || !s.booking || clinicBusy) return;
        if (!confirm(`${s.booking.label} 클리닉 신청을 취소할까요?\n\n학부모님과 선생님께 문자가 갑니다.`)) return;
        const r = await clinicRequest("DELETE");
        if (r) { clinicPickFromBooking(); renderClinicBooking("클리닉 신청을 취소했어요.", true); }
      }

      // 'M.D' → 정렬용 숫자(월*100+일).
      // 목록에 11~12월과 1~2월이 함께 있으면 해가 바뀐 것으로 보고
      // 1~2월을 뒤로 보낸다(12.30 다음이 1.5가 되도록).
      function periodSortKeys(dates) {
        const parsed = dates.map((d) => {
          const m = (d || "").match(/^\s*(\d{1,2})\s*\.\s*(\d{1,2})/);
          return m ? { m: parseInt(m[1]), d: parseInt(m[2]) } : null;
        });
        const months = parsed.filter(Boolean).map((x) => x.m);
        const wraps = months.some((m) => m >= 11) && months.some((m) => m <= 2);
        return parsed.map((x) =>
          x === null
            ? -Infinity // 날짜를 못 읽으면 맨 뒤로
            : x.m * 100 + x.d + (wraps && x.m <= 2 ? 1200 : 0),
        );
      }

      // 날짜 최신순 정렬 (같은 날짜면 등록 순서 유지)
      function sortByDateDesc(list, dateOf) {
        const keys = periodSortKeys(list.map(dateOf));
        return list
          .map((item, i) => ({ item, key: keys[i], i }))
          .sort((a, b) => b.key - a.key || b.i - a.i)
          .map((x) => x.item);
      }

      // 커트라인 미달 판정 (admin.html과 같은 규칙)
      function isBelowCut(val, cut) {
        return (
          val !== null &&
          val !== undefined &&
          val !== "" &&
          cut !== null &&
          cut !== undefined &&
          cut !== "" &&
          parseFloat(val) < parseFloat(cut)
        );
      }

      // 항목 한 칸의 표시 내용.
      // 커트라인 미달 + 재시험 통과 → 점수 대신 '재시험 통과' (초록)
      // 커트라인 미달 + 미통과     → 점수를 빨간색으로 + '재시험 대상'
      // 재시험은 점수가 아니라 통과 여부만 관리하므로, 통과하면 원점수를 감춘다.
      function itemCellHtml(item, value, retestPass) {
        const below = isBelowCut(value, item.cut);
        const passed = below && retestPass?.[item.key] === true;
        const label = `<div class="score-label">${escapeHtml(item.label) || "-"}</div>`;
        const shown = value === null || value === undefined ? "-" : value;
        const max = item.max ?? "";
        // 통과했으면 기준 미달 강조를 풀고 초록 배지만 붙인다 (점수는 항상 그대로 보여준다)
        return `<div class="score-item${below && !passed ? " below-cut" : ""}">
            ${label}
            <div class="score-value">${shown}<span class="score-max"> / ${max}</span></div>
            ${passed ? `<div class="retest-pass">재시험 통과</div>` : ""}
            ${below && !passed ? `<div class="retest-target">재시험 대상</div>` : ""}
          </div>`;
      }

      // 점수(항목 점수 또는 총점)가 하나라도 입력돼 있는지.
      // 5번째 이상 항목은 물리 컬럼이 없어 item_scores(jsonb)에 있으므로 그 키까지 함께 본다
      // (여기서는 시험별 항목 설정을 모르므로 응답에 실려온 키를 그대로 쓴다).
      function hasMockScore(row) {
        if (!row) return false;
        if (row.score !== null && row.score !== undefined) return true;
        const keys = MOCK_ITEM_KEYS.concat(Object.keys(row.item_scores || {}));
        return keys.some((k) => {
          const v = itemVal(row, k);
          return v !== null && v !== undefined;
        });
      }

      // 학부모에게 이 모의고사를 보여줄지: 점수가 있거나, 선생님이 미응시로 표시한 경우만
      function isMockVisible(row) {
        return hasMockScore(row) || row?.absent === true;
      }

      // 선생님이 출석 체크를 해제한 주차 = 결석
      // (scores.attendance는 기본값 true라 값이 없으면 출석으로 본다)
      function isAbsentWeek(row) {
        return row?.attendance === false;
      }

      // 주차 + 모의고사를 하나의 드롭다운으로. 항목이 늘어나도 화면이 밀리지 않는다.
      function renderPeriodSelector() {
        const sel = document.getElementById("period-select");
        sel.innerHTML = "";

        const exams = loginData.exams || [];
        window._mockScoreMap = {};
        (loginData.myMockScores || []).forEach((s) => {
          window._mockScoreMap[s.exam_id] = s;
        });

        const weekList = sortByDateDesc(
          currentWeeks || [],
          (w) => w.test_date || w.label,
        );
        // 반 전체가 아니라 일부만 응시하는 모의고사가 있어서,
        // 점수도 없고 미응시로 표시되지도 않은 시험은 아예 보여주지 않는다.
        const examList = sortByDateDesc(
          exams.filter((e) => isMockVisible(window._mockScoreMap[e.id])),
          (e) => e.exam_date || e.label,
        );

        if (!weekList.length && !examList.length) {
          const opt = document.createElement("option");
          opt.textContent = "등록된 주차가 없습니다.";
          sel.appendChild(opt);
          sel.disabled = true;
          return;
        }
        sel.disabled = false;

        // 결석한 주차는 드롭다운에서 바로 구분되게 표시한다
        const weekOptionText = (w) => {
          const name = w.label || w.test_date;
          const row = (allScores || []).find((s) => s.week_id === w.id);
          return isAbsentWeek(row) ? `${name} — 결석` : name;
        };
        // 모의고사는 이름 뒤에 (월.일)을 붙여 언제 본 시험인지 바로 보이게 한다.
        // 이름을 따로 안 붙인 시험은 주차와 구분되도록 '모의고사'를 앞에 붙인다.
        const examOptionText = (e) => {
          const name =
            e.label && e.exam_date && e.label !== e.exam_date
              ? `${e.label} (${e.exam_date})`
              : `모의고사 (${e.exam_date || e.label})`;
          const row = window._mockScoreMap[e.id];
          return hasMockScore(row) ? name : `${name} — 미응시`;
        };

        // 주차와 모의고사를 한 목록에 섞어 날짜 최신순으로 정렬한다.
        // (예전에는 둘을 그룹으로 나눠 넣어서, 모의고사가 날짜와 상관없이 항상 맨 아래에 모였다)
        const periodItems = sortByDateDesc(
          [
            ...weekList.map((w) => ({
              value: "w" + w.id,
              date: w.test_date || w.label,
              text: weekOptionText(w),
            })),
            ...examList.map((e) => ({
              value: "m" + e.id,
              date: e.exam_date || e.label,
              text: examOptionText(e),
            })),
          ],
          (p) => p.date,
        );

        periodItems.forEach((p) => {
          const opt = document.createElement("option");
          opt.value = p.value;
          opt.textContent = p.text;
          sel.appendChild(opt);
        });

        if (!weekList.length) {
          hideChartAndSummary();
          document.getElementById("score-content").innerHTML =
            '<div class="empty-msg">등록된 주차가 없습니다. 모의고사 결과를 선택해 확인하세요.</div>';
        }

        // 기본 선택: 가장 최근 주차(없으면 가장 최근 모의고사)
        sel.value = weekList.length
          ? "w" + weekList[0].id
          : "m" + examList[0].id;
        onPeriodChange(sel.value);
      }

      function onPeriodChange(value) {
        if (!value) return;
        const id = parseInt(value.slice(1));
        const isMock = value.charAt(0) === "m";
        document.getElementById("score-content").style.display = isMock
          ? "none"
          : "block";
        document.getElementById("mock-score-section").style.display = "none";
        if (isMock) {
          hideChartAndSummary();
          showMockScore(id);
        } else {
          showChartAndSummary();
          loadScore(id);
        }
      }

      async function showMockScore(examId) {
        const s = window._mockScoreMap?.[examId];
        const section = document.getElementById("mock-score-section");
        section.style.display = "block";
        // 점수가 없는 경우: 선생님이 미응시로 표시했으면 그 사실만 알리고,
        // 아니면(응시 대상이 아니었던 학생) 드롭다운에서 이미 걸러진다.
        if (!hasMockScore(s)) {
          const examRow = (loginData.exams || []).find((e) => e.id === examId);
          const examName =
            examRow &&
            examRow.label &&
            examRow.exam_date &&
            examRow.label !== examRow.exam_date
              ? `${examRow.label} (${examRow.exam_date})`
              : examRow?.label || examRow?.exam_date || "";
          section.innerHTML = s?.absent
            ? `
    <div class="card">
      <div class="card-header"><h2>모의고사 점수</h2></div>
      <div class="card-body">
        <div class="notice-card warning" style="margin-bottom:0">
          <span class="notice-icon" aria-hidden="true"></span>
          <div>
            <div class="notice-title">미응시</div>
            <div class="notice-body">${escapeHtml(examName)}<br>해당 모의고사에 응시하지 않았습니다.</div>
          </div>
        </div>
      </div>
    </div>`
            : '<div class="empty-msg">해당 모의고사에 응시하지 않았습니다.</div>';
          return;
        }

        // group_id가 같은 모의고사 전체(= 관리자가 선택한 반들)를 기준으로 평균/석차 계산
        const examInfo = (loginData.exams || []).find((e) => e.id === examId);
        const groupId = examInfo?.group_id;
        // 항목 설정이 없으면(옛 모의고사 또는 서버 응답에 item_config 없음)
        // 예전처럼 '점수' 1개(만점 100)로 동작한다.
        const mockItems = normalizeItemConfig(
          examInfo?.item_config,
          DEFAULT_MOCK_ITEM_CONFIG,
        ).filter((it) => it.active);

        let rankExamIds;
        if (
          groupId &&
          loginData.mockGroupExamMap &&
          loginData.mockGroupExamMap[groupId]
        ) {
          rankExamIds = new Set(loginData.mockGroupExamMap[groupId]);
        } else {
          rankExamIds = new Set([examId]);
        }
        const allMockScores = (loginData.mockRankScores || []).filter((x) =>
          rankExamIds.has(x.exam_id),
        );

        // 항목 점수가 있으면 항목 합계, 없으면 기존 score 폴백.
        // 0점도 응시로 인정한다(빈 값=미응시만 제외).
        const rowTotal = (row) => {
          const vals = mockItems
            .map((it) => itemVal(row, it.key))
            .filter((v) => v !== null && v !== undefined);
          if (vals.length) return vals.reduce((a, b) => a + parseFloat(b), 0);
          return row.score === null || row.score === undefined
            ? null
            : parseFloat(row.score);
        };

        const validScores = allMockScores
          .map(rowTotal)
          .filter((x) => x !== null);
        const avg = validScores.length
          ? (
              validScores.reduce((a, b) => a + b, 0) / validScores.length
            ).toFixed(1)
          : null;

        const myTotal = rowTotal(s);
        const totalMax = mockItems.reduce((a, it) => a + (it.max || 0), 0);

        // 석차 계산
        const sorted = validScores.slice().sort((a, b) => b - a);
        const rank =
          myTotal === null ? "-" : sorted.findIndex((v) => v === myTotal) + 1;

        // 항목이 2개 이상이면 항목별 점수도 함께 보여준다.
        // 항목이 1개여도 재시험 상태(통과/대상)가 있으면 보여줘야 하므로 함께 판단한다.
        const hasItemValues = mockItems.some(
          (it) =>
            itemVal(s, it.key) !== null && itemVal(s, it.key) !== undefined,
        );
        const hasRetestInfo = mockItems.some((it) =>
          isBelowCut(itemVal(s, it.key), it.cut),
        );
        const itemsHtml =
          hasItemValues && (mockItems.length > 1 || hasRetestInfo)
            ? `<div class="score-grid items-${mockItems.length}" style="margin-bottom:10px">
            ${mockItems
              .map((it) => itemCellHtml(it, itemVal(s, it.key), s.retest_pass))
              .join("")}
          </div>`
            : "";

        section.innerHTML = `
    <div class="card">
      <div class="card-header"><h2>모의고사 점수</h2></div>
      <div class="card-body">
        ${itemsHtml}
        <div class="score-item total" style="border-radius:12px;margin-bottom:10px">
          <div class="score-label">총점</div>
          <div><span class="score-value" style="color:white">${myTotal === null ? "-" : myTotal}</span><span class="score-max"> / ${totalMax}</span></div>
        </div>
        <div class="meta-grid">
          <div class="meta-item">
            <div class="meta-label">평균</div>
            <div class="meta-value">${avg ? avg + "점" : "-"}</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">석차</div>
            <div class="meta-value">${rank !== "-" ? rank + "등" : "-"}</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">응시 인원</div>
            <div class="meta-value">${validScores.length}명</div>
          </div>
        </div>
        ${s.memo ? `<div style="margin-top:6px;font-size:13px;color:var(--gray)">${escapeHtml(s.memo)}</div>` : ""}
        ${mockReportButtonHtml(examId)}
      </div>
    </div>`;
      }

      // ── 모의고사 분석지 (학생별 PDF) ──
      // parent-login이 '학부모에게 공개'된 시험 중 이 학생 파일이 있는 시험 id만 mockReports로 보낸다.
      // 서버가 아직 이 값을 안 보내면(배포 전) 버튼이 생기지 않는다.
      function hasMockReport(examId) {
        return (
          Array.isArray(loginData?.mockReports) &&
          loginData.mockReports.includes(examId)
        );
      }

      function mockReportButtonHtml(examId) {
        if (!hasMockReport(examId)) return "";
        return `<button class="btn btn-primary" style="margin-top:14px" onclick="openMockReport(${examId}, this)">📄 상세 분석지 보기</button>
        <div class="mock-report-msg" id="mock-report-msg"></div>`;
      }

      // 링크는 누를 때마다 새로 받는다 (5분 뒤 만료 — 문자·카톡으로 퍼져도 곧 열리지 않게).
      // 새 창을 먼저 열어 두고 주소를 나중에 넣어야 휴대폰 사파리의 팝업 차단에 걸리지 않는다.
      // report: 모의고사는 시험 id, 주차 시험지는 'w주차id' (parent-login GET ?report=)
      async function openReportLink(report, btn, msgId, what) {
        const msg = document.getElementById(msgId);
        if (msg) msg.textContent = "";
        if (btn) btn.disabled = true;
        const w = window.open("", "_blank");
        try {
          const res = await fetch(
            `${PARENT_LOGIN_URL}?report=${encodeURIComponent(report)}`,
            { method: "GET" },
          );
          const data = res.ok ? await res.json() : null;
          if (!data || !data.url) throw new Error(String(res.status));
          if (w) w.location.href = data.url;
          else location.href = data.url;
        } catch (e) {
          if (w) w.close();
          if (msg)
            msg.textContent =
              `${what}를 열지 못했습니다. 잠시 후 다시 시도해 주세요.`;
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      function openMockReport(examId, btn) {
        return openReportLink(String(examId), btn, "mock-report-msg", "분석지");
      }

      // ── 주차 시험지 (학생별 스캔 PDF, 2026-11-22) ──
      // parent-login이 '학부모에게 공개'된 이 반 주차 중 이 학생 파일이 있는 주차 id만 weekReports로 보낸다.
      // 서버가 아직 이 값을 안 보내면(배포 전) 버튼이 생기지 않는다.
      function weekReportButtonHtml(weekId) {
        if (!(Array.isArray(loginData?.weekReports) && loginData.weekReports.includes(weekId))) return "";
        return `<button class="btn btn-primary" style="margin-top:14px" onclick="openWeekReport(${weekId}, this)">📄 시험지 보기</button>
        <div class="mock-report-msg" id="week-report-msg"></div>`;
      }

      function openWeekReport(weekId, btn) {
        return openReportLink(`w${weekId}`, btn, "week-report-msg", "시험지");
      }

      // ── 주차 채점 결과 글 (2026-11-22, supabase/week-results.sql) ──
      // parent-login이 '학부모에게 공개'된 이 반 주차 중 이 학생 결과가 있는 것만 weekResults { 주차id: ['vocab','omr'] }로 보낸다.
      // 내용은 버튼을 누를 때 GET ?result=w주차id 로 받는다(로그인 응답을 무겁게 하지 않게). 서버 배포 전이면 버튼이 안 생긴다.
      // data 모양은 admin.html wrVocabData / wrOmrData 가 만든다.
      const WRES_LABEL = {
        vocab: "📝 단어·해석 채점 결과",
        omr: "📝 틀린 문제 보기 (객관식·어법·서술형)",
      };
      const _wresCache = {}; // '학생id:주차id' → results (같은 기기에서 다른 학생이 로그인해도 섞이지 않게 학생 id를 붙인다)
      let _wresOpen = null; // { weekId, kind }
      function wresKey(weekId) {
        return `${loginData?.student?.id ?? ""}:${weekId}`;
      }

      function weekResultKinds(weekId) {
        const k = loginData?.weekResults?.[String(weekId)];
        return Array.isArray(k) ? ["vocab", "omr"].filter((x) => k.includes(x)) : [];
      }

      function weekResultButtonsHtml(weekId) {
        _wresOpen = null; // 주차 카드를 새로 그리면 펼친 것도 닫힌다
        const kinds = weekResultKinds(weekId);
        if (!kinds.length) return "";
        return `<div class="wres-btns">${kinds
          .map((k) => `<button class="btn wres-btn" data-kind="${k}" onclick="toggleWeekResult(${weekId}, '${k}')">${WRES_LABEL[k]}</button>`)
          .join("")}</div>
        <div class="mock-report-msg" id="wres-msg"></div>
        <div id="wres-body"></div>`;
      }

      function markWresBtns() {
        document.querySelectorAll(".wres-btn").forEach((b) =>
          b.classList.toggle("open", !!_wresOpen && _wresOpen.kind === b.dataset.kind),
        );
      }

      async function toggleWeekResult(weekId, kind) {
        const body = document.getElementById("wres-body");
        const msg = document.getElementById("wres-msg");
        if (!body) return;
        msg.textContent = "";
        if (_wresOpen && _wresOpen.weekId === weekId && _wresOpen.kind === kind) {
          _wresOpen = null;
          body.innerHTML = "";
          markWresBtns();
          return;
        }
        const me = (_wresOpen = { weekId, kind });
        markWresBtns();
        let data = _wresCache[wresKey(weekId)];
        if (!data) {
          body.innerHTML = '<div class="wres-loading">불러오는 중...</div>';
          try {
            const res = await fetch(`${PARENT_LOGIN_URL}?result=w${weekId}`, { method: "GET" });
            const j = res.ok ? await res.json() : null;
            if (!j || !j.results) throw new Error(String(res.status));
            data = _wresCache[wresKey(weekId)] = j.results;
            // 문제지·답지(docx)의 해석 구문 해설 — 문장 번호 → 본문 조각 (서버 배포 전이거나 문제지가 없으면 없음)
            data.__explain = j.explain && typeof j.explain === "object" ? j.explain : null;
          } catch (e) {
            if (_wresOpen === me) {
              _wresOpen = null;
              markWresBtns();
              body.innerHTML = "";
              msg.textContent = "채점 결과를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.";
            }
            return;
          }
        }
        if (_wresOpen !== me) return; // 그 사이 다른 버튼을 눌렀다
        const d = data[kind];
        body.innerHTML = d
          ? `<div class="wres-panel">${kind === "vocab" ? vocabResultHtml(d, data.__explain) : omrResultHtml(d)}</div>`
          : '<div class="wres-loading">채점 결과가 없습니다.</div>';
      }

      function wresNum(n) {
        return n === null || n === undefined || n === "" ? "-" : String(Math.round(Number(n) * 100) / 100);
      }
      function wresTxt(s) {
        return escapeHtml(s || "")
          .replace(/\[\s*판독\s*불가\s*\]/g, "(알아보기 어려움)")
          .replace(/\n/g, "<br>");
      }

      // 해석 문장 → 구문 해설 상자. 번호가 같아도 문장이 다르면(다른 시험의 해설) 보여 주지 않는다 — 원문 앞부분이 해설 상자 글에 들어 있어야 한다.
      function sentExplainNodes(x, explain) {
        if (!explain) return null;
        const norm = (t) => String(t || "").toLowerCase().replace(/[^a-z]/g, "");
        const head = norm(x.source).slice(0, 40);
        if (head.length < 12) return null;
        const textOf = (nodes) => {
          let out = "";
          const walk = (n) => {
            if (!n) return;
            if (Array.isArray(n)) return n.forEach(walk);
            if (n.t === "p") out += (Array.isArray(n.r) ? n.r : []).map((r) => r?.[0] ?? "").join("") + " ";
            else if (n.t === "tbl") (Array.isArray(n.rows) ? n.rows : []).forEach((row) => (Array.isArray(row) ? row : []).forEach(walk));
          };
          walk(nodes);
          return norm(out);
        };
        const no = String(parseInt(x.no, 10));
        const cands = [explain[no], ...Object.keys(explain).filter((k) => k !== no).map((k) => explain[k])];
        const hit = cands.find((n) => Array.isArray(n) && textOf(n).includes(head));
        if (!hit) return null;
        // 상자 첫 문단(번호 + 원문 + 출처)은 위에 원문이 이미 있으니 빼고 보여 준다
        const box = hit[0] && hit[0].t === "tbl" && hit[0].rows?.[0]?.[0] ? hit[0].rows[0][0] : hit;
        const first = box[0] && box[0].t === "p" ? norm((box[0].r || []).map((r) => r?.[0] ?? "").join("")) : "";
        return first.includes(head) ? box.slice(1) : box;
      }

      function vocabResultHtml(d, explain) {
        const sc = d.score || {};
        const words = Array.isArray(d.words) ? d.words : [];
        const sents = Array.isArray(d.sentences) ? d.sentences : [];
        const wrong = words.filter((w) => w.mark !== "O");
        const right = words.filter((w) => w.mark === "O");
        const ans = (w) => (w.blank || !w.answer ? '<span class="wres-blank">(빈칸)</span>' : wresTxt(w.answer));
        const sum = `<div class="wres-sum">
          <span>단어 <b>${wresNum(sc.word)}</b> / ${wresNum(sc.wordMax)}</span>
          <span>해석 <b>${wresNum(sc.sentence)}</b> / ${wresNum(sc.sentenceMax)}</span>
          <span>합계 <b>${wresNum(sc.total)}</b> / ${wresNum(sc.totalMax)}</span></div>`;
        const wrongHtml = wrong.length
          ? `<div class="wres-h">틀린 단어 ${wrong.length}개</div>` +
            wrong
              .map(
                (w) => `<div class="wres-word x">
            <div><span class="wres-no">${wresNum(w.no)}</span><b>${wresTxt(w.word)}</b></div>
            <div class="wres-row"><span class="wres-k">내 답</span><span>${ans(w)}</span></div>
            <div class="wres-row"><span class="wres-k">정답</span><span>${wresTxt(w.correct)}</span></div>
            ${w.reason && !w.blank ? `<div class="wres-reason">${wresTxt(w.reason)}</div>` : ""}
          </div>`,
              )
              .join("")
          : words.length
            ? '<div class="wres-good" style="margin-top:12px">단어를 모두 맞혔어요 👍</div>'
            : "";
        const rightHtml = right.length
          ? `<details class="wres-more"><summary>맞은 단어 ${right.length}개 보기</summary>${right
              .map(
                (w) => `<div class="wres-word o">
            <div><span class="wres-no">${wresNum(w.no)}</span><b>${wresTxt(w.word)}</b></div>
            <div class="wres-row"><span class="wres-k">내 답</span><span>${ans(w)}</span></div>
            <div class="wres-row"><span class="wres-k">정답</span><span>${wresTxt(w.correct)}</span></div>
            ${w.reason ? `<div class="wres-reason">${wresTxt(w.reason)}</div>` : ""}
          </div>`,
              )
              .join("")}</details>`
          : "";
        const sentHtml = sents.length
          ? `<div class="wres-h">문장 해석</div>` +
            sents
              .map((x) => {
                const full = x.max && x.score >= x.max;
                return `<div class="wres-sent">
            <div class="wres-sent-top"><span class="wres-no">${wresNum(x.no)}번</span>
              <span class="wres-pts${full ? " full" : ""}">${wresNum(x.score)} / ${wresNum(x.max)}점${x.percent !== null && x.percent !== undefined ? ` (${wresNum(x.percent)}%)` : ""}</span></div>
            <div class="wres-src">${wresTxt(x.source)}</div>
            <div class="wres-row col"><span class="wres-k">내 해석</span><div>${x.blank || !x.answer ? '<span class="wres-blank">(빈칸)</span>' : wresTxt(x.answer)}</div></div>
            ${x.reason ? `<div class="wres-row col"><span class="wres-k">감점·평가 사유</span><div>${wresTxt(x.reason)}</div></div>` : ""}
            <div class="wres-row col"><span class="wres-k">올바른 해석</span><div>${wresTxt(x.correct)}</div></div>
            ${(() => {
              const ex = sentExplainNodes(x, explain);
              return ex && ex.length
                ? `<details class="wres-ex"><summary>📖 구문 해설 보기</summary><div class="wd-view">${wdHtml(ex)}</div></details>`
                : "";
            })()}
          </div>`;
              })
              .join("")
          : "";
        return sum + wrongHtml + rightHtml + sentHtml;
      }

      // 객관식은 틀린 문제, 어법·서술형은 만점이 아닌 문제를 번호로 보여 준다 (부분 점수는 점수와 함께)
      function omrWrongOf(sec) {
        return (sec.items || [])
          .map((it, ii) => ({ it, ii }))
          .filter(({ it }) => (sec.type === "mc" ? it.ok !== true : Number(it.score ?? 0) < Number(it.max ?? 0)));
      }

      function omrResultHtml(d) {
        const secs = Array.isArray(d.sections) ? d.sections : [];
        const sum = `<div class="wres-sum">${secs
          .map((s) => `<span>${escapeHtml(s.label)} <b>${wresNum(s.score)}</b> / ${wresNum(s.max)}</span>`)
          .join("")}${d.total ? `<span>합계 <b>${wresNum(d.total.score)}</b> / ${wresNum(d.total.max)}</span>` : ""}</div>`;
        const parts = secs.map((s, si) => {
          const wrong = omrWrongOf(s);
          const chips = wrong
            .map(
              ({ it, ii }) =>
                `<button class="wres-chip" data-sec="${si}" data-item="${ii}" onclick="showOmrItem(${si}, ${ii})">${escapeHtml(it.no)}번${s.type === "mc" ? "" : ` <small>${wresNum(it.score)}/${wresNum(it.max)}</small>`}</button>`,
            )
            .join("");
          return `<div class="wres-sec"><div class="wres-h">${escapeHtml(s.label)}${wrong.length ? ` <span class="wres-muted">틀린 문제 ${wrong.length}개</span>` : ""}</div>
            ${wrong.length ? `<div class="wres-chips">${chips}</div><div class="wres-detail" id="wres-detail-${si}"></div>` : '<div class="wres-good">모두 맞혔어요 👍</div>'}</div>`;
        });
        return `${sum}<div class="wres-hint">문제 번호를 누르면 내 답과 정답이 보여요</div>${parts.join("")}`;
      }

      function showOmrItem(si, ii) {
        const d = _wresOpen && _wresCache[wresKey(_wresOpen.weekId)]?.omr;
        const sec = d?.sections?.[si];
        const it = sec?.items?.[ii];
        const box = document.getElementById(`wres-detail-${si}`);
        if (!it || !box) return;
        const same = box.dataset.item === String(ii);
        document
          .querySelectorAll(`.wres-chip[data-sec="${si}"]`)
          .forEach((c) => c.classList.toggle("active", !same && c.dataset.item === String(ii)));
        if (same) {
          box.dataset.item = "";
          box.innerHTML = "";
          return;
        }
        box.dataset.item = String(ii);
        const blank = '<span class="wres-blank">(빈칸)</span>';
        let html = `<div class="wres-detail-top"><b>${escapeHtml(sec.label)} ${escapeHtml(it.no)}번</b>${sec.type === "mc" ? "" : ` <span class="wres-pts">${wresNum(it.score)} / ${wresNum(it.max)}점</span>`}</div>`;
        if (sec.type === "mc") {
          html += `<div class="wres-row"><span class="wres-k">내 답</span><span>${it.mine ? wresTxt(it.mine) : blank}</span></div>
            <div class="wres-row"><span class="wres-k">정답</span><span>${wresTxt(it.correct)}</span></div>`;
        } else if (sec.type === "fill") {
          const mine = (it.entries || [])
            .map((e) =>
              e.blank
                ? `<li class="x">${blank}</li>`
                : `<li class="${e.ok === true ? "ok" : e.ok === false ? "x" : ""}">${e.ok === true ? "✓ " : e.ok === false ? "✗ " : ""}${wresTxt(e.num)} → ${wresTxt(e.answer)}</li>`,
            )
            .join("");
          const key = (it.key || []).map((k) => `<li>${wresTxt(k.num)} → ${wresTxt(k.answer)}</li>`).join("");
          html += `<div class="wres-row col"><span class="wres-k">내 답</span><ul class="wres-list">${mine}</ul></div>
            ${key ? `<div class="wres-row col"><span class="wres-k">정답</span><ul class="wres-list">${key}</ul></div>` : ""}`;
        } else {
          html += `<div class="wres-row col"><span class="wres-k">내 답</span><div>${it.blank || !it.answer ? blank : wresTxt(it.answer)}</div></div>
            ${it.correct ? `<div class="wres-row col"><span class="wres-k">정답</span><div>${wresTxt(it.correct)}</div></div>` : ""}
            ${it.note ? `<div class="wres-reason">${wresTxt(it.note)}</div>` : ""}`;
        }
        if (weekHasPaper(_wresOpen.weekId)) {
          html += `<div class="wres-paper-btns">
            <button class="wres-paper-btn" onclick="openPaper(${si}, ${ii}, 'q', this)">📄 문제 보기</button>
            <button class="wres-paper-btn" onclick="openPaper(${si}, ${ii}, 'a', this)">💡 정답·해설 보기</button></div>
            <div class="mock-report-msg" id="wres-paper-msg-${si}"></div>`;
        }
        box.innerHTML = html;
      }

      // ── 문제지·답지 (docx에서 꺼낸 본문, 2026-11-23, supabase/week-papers.sql) ──
      // parent-login이 공개된 주차 중 문제지가 올라간 주차 id를 weekPapers로 보낸다(배포 전이면 버튼이 안 생긴다).
      // 버튼을 누르면 GET ?paper=w주차id&k=종류&n=번호 로 그 문항의 문제·지문·해설 본문 조각을 받아 창에 글자로 보여 준다.
      // 본문 조각: { t:'p', r:[[글자, 꼴]], li? } · { t:'tbl', rows:[[ [조각…] ]], sh? } — 꼴: 1 굵게 · 2 밑줄 · 4 윗첨자 · 8 기울임
      const _paperCache = {};
      function weekHasPaper(weekId) {
        return Array.isArray(loginData?.weekPapers) && loginData.weekPapers.includes(weekId);
      }

      async function openPaper(si, ii, what, btn) {
        const weekId = _wresOpen?.weekId;
        const sec = weekId && _wresCache[wresKey(weekId)]?.omr?.sections?.[si];
        const it = sec?.items?.[ii];
        if (!it) return;
        const msg = document.getElementById(`wres-paper-msg-${si}`);
        if (msg) msg.textContent = "";
        const ck = `${wresKey(weekId)}:${sec.label}:${it.no}`;
        let data = _paperCache[ck];
        if (!data) {
          if (btn) btn.disabled = true;
          try {
            const res = await fetch(
              `${PARENT_LOGIN_URL}?paper=w${weekId}&k=${encodeURIComponent(sec.label)}&n=${encodeURIComponent(it.no)}`,
              { method: "GET" },
            );
            const j = await res.json().catch(() => null);
            if (res.status === 404 && j?.error === "paper_item_not_found") {
              if (msg) msg.textContent = "이 문제는 문제지에 없어요.";
              return;
            }
            if (!res.ok || !j) throw new Error(String(res.status));
            data = _paperCache[ck] = j;
          } catch (e) {
            if (msg) msg.textContent = "문제를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.";
            return;
          } finally {
            if (btn) btn.disabled = false;
          }
        }
        showPaperViewer(`${sec.label} ${it.no}번`, data, what);
      }

      // 본문 조각 → HTML (★ admin.html wdHtml과 같게)
      function wdRunsHtml(runs) {
        return (Array.isArray(runs) ? runs : [])
          .map((r) => {
            let h = escapeHtml(String(r?.[0] ?? "")).replace(/\t+/g, " ").replace(/\n/g, "<br>");
            const f = r?.[1] | 0;
            if (f & 4) h = `<sup>${h}</sup>`;
            if (f & 2) h = `<u>${h}</u>`;
            if (f & 8) h = `<i>${h}</i>`;
            if (f & 1) h = `<b>${h}</b>`;
            return h;
          })
          .join("");
      }
      function wdHtml(nodes) {
        return (Array.isArray(nodes) ? nodes : [])
          .map((n) => {
            if (!n || typeof n !== "object") return "";
            if (n.t === "p") {
              const text = (Array.isArray(n.r) ? n.r : []).map((r) => r?.[0] ?? "").join("").trim();
              return `<p class="wd-p${/^[①-⑩]/.test(text) ? " wd-ch" : ""}">${n.li ? "• " : ""}${wdRunsHtml(n.r)}</p>`;
            }
            if (n.t === "tbl") {
              const rows = Array.isArray(n.rows) ? n.rows : [];
              if (rows.length === 1 && Array.isArray(rows[0]) && rows[0].length === 1)
                return `<div class="wd-box${n.sh ? " sh" : ""}">${wdHtml(rows[0][0])}</div>`;
              return `<table class="wd-tbl${n.sh ? " sh" : ""}">${rows
                .map((r) => `<tr>${(Array.isArray(r) ? r : []).map((c) => `<td>${wdHtml(c)}</td>`).join("")}</tr>`)
                .join("")}</table>`;
            }
            return "";
          })
          .join("");
      }
      function paperBlocks(list) {
        return (Array.isArray(list) ? list : []).map((nodes) => `<div class="wd-view">${wdHtml(nodes)}</div>`).join("");
      }

      function showPaperViewer(title, data, what) {
        const v = document.getElementById("wpv");
        if (!v) return;
        v._data = data;
        v._title = title;
        const hasA = (data.a || []).length > 0;
        const tab = what === "a" && hasA ? "a" : "q";
        const body =
          tab === "q"
            ? `${paperBlocks(data.q)}${(data.p || []).length ? `<div class="wpv-sep">지문</div>${paperBlocks(data.p)}` : ""}`
            : paperBlocks(data.a);
        v.innerHTML = `<div class="wpv-head">
            <b>${escapeHtml(title)}</b>
            <div class="wpv-tabs">
              <button class="${tab === "q" ? "on" : ""}" onclick="switchPaperTab('q')">문제</button>
              <button class="${tab === "a" ? "on" : ""}" ${hasA ? "" : "disabled"} onclick="switchPaperTab('a')">정답·해설</button>
            </div>
            <button class="wpv-close" onclick="closePaperViewer()" aria-label="닫기">✕</button>
          </div>
          ${what === "a" && !hasA ? '<div class="wpv-note">이 문제는 해설이 없어요.</div>' : ""}
          <div class="wpv-body">${body}</div>`;
        v.classList.add("open");
        document.body.style.overflow = "hidden";
        v.querySelector(".wpv-body").scrollTop = 0;
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && document.getElementById("wpv")?.classList.contains("open")) closePaperViewer();
      });

      function switchPaperTab(tab) {
        const v = document.getElementById("wpv");
        if (v && v._data) showPaperViewer(v._title, v._data, tab);
      }

      function closePaperViewer() {
        const v = document.getElementById("wpv");
        if (v) {
          v.classList.remove("open");
          v.innerHTML = "";
        }
        document.body.style.overflow = "";
      }

      function renderChart() {
        const card = document.getElementById("chart-card");
        card.style.display = "block";
        const scoreMap = {};
        allScores.forEach((s) => {
          scoreMap[s.week_id] = computeTotal(s, s.week_id);
        });
        // 주차를 뒤늦게 추가해도 그래프는 왼쪽(옛날)→오른쪽(최근) 날짜순으로 그린다
        const chartWeeks = sortByDateDesc(
          currentWeeks,
          (w) => w.test_date || w.label,
        ).reverse();
        const labels = chartWeeks.map((w) => w.label || w.test_date);
        const data = chartWeeks.map((w) => scoreMap[w.id] ?? null);
        // y축 최대값: 주차별 총점 만점 중 가장 큰 값 (기본 100)
        const yMax = Math.max(
          100,
          ...currentWeeks.map((w) => totalMaxForWeek(w.id)),
        );
        if (chartInstance) chartInstance.destroy();
        const ctx = document.getElementById("score-chart").getContext("2d");
        chartInstance = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "총점",
                data,
                borderColor: "#2f5ea8",
                backgroundColor: "rgba(47,94,168,0.12)",
                borderWidth: 2.5,
                pointBackgroundColor: "#0f1f3d",
                pointRadius: 5,
                pointHoverRadius: 7,
                tension: 0.35,
                fill: true,
                spanGaps: true,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: (ctx) => `${ctx.parsed.y}점` } },
            },
            scales: {
              y: {
                min: 0,
                max: yMax,
                ticks: { font: { size: 11 }, color: "#6b6b6b" },
                grid: { color: "rgba(0,0,0,0.05)" },
              },
              x: {
                ticks: { font: { size: 11 }, color: "#6b6b6b" },
                grid: { display: false },
              },
            },
          },
        });
      }

      async function loadScore(weekId) {
        const content = document.getElementById("score-content");
        content.innerHTML =
          '<div class="loading show"><div class="spinner"></div>불러오는 중...</div>';
        try {
          const scoreData = allScores.find((s) => s.week_id === weekId);

          if (!scoreData) {
            content.innerHTML =
              '<div class="empty-msg">해당 주차 점수가 아직 입력되지 않았습니다.</div>';
            return;
          }

          const s = scoreData;
          let rank = "-",
            total_students = "-";

          // group_id가 있으면 같은 그룹 전체, 없으면 해당 주차만 기준으로 평균/석차 계산
          const weekInfo = (currentWeeks || []).find((w) => w.id === weekId);
          const groupId = weekInfo?.group_id;

          let rankWeekIds;
          if (
            groupId &&
            loginData.groupWeekMap &&
            loginData.groupWeekMap[groupId]
          ) {
            rankWeekIds = new Set(loginData.groupWeekMap[groupId]);
          } else {
            rankWeekIds = new Set([weekId]);
          }
          const scoresForRank = (loginData.rankScores || []).filter((x) =>
            rankWeekIds.has(x.week_id),
          );

          // 화면에 표시할 본인 총점 (해당 주차의 활성 항목 합계)
          const myTotal = computeTotal(s, weekId);

          // 석차·평균은 비교 대상 전원이 같은 기준이어야 한다.
          // 한 명이라도 항목 컬럼이 응답에 없으면 전원 total_score 기준으로 통일.
          // 그룹 석차는 다른 반의 주차까지 포함되지만 같은 시험이므로
          // 항목 구성은 현재 주차 설정을 전원에게 동일 적용한다.
          // (다른 반 week_id는 weekConfigMap에 없어 기본값으로 떨어지므로)
          const canItemBased = [s, ...scoresForRank].every((r) =>
            itemsForWeek(weekId).every(
              (it) => itemVal(r, it.key) !== undefined,
            ),
          );
          if (!canItemBased) {
            console.warn(
              "[점수] 항목 점수 컬럼이 응답에 없어 석차·평균을 기존 total_score 기준으로 계산합니다. " +
                "parent-login 함수의 select에 item_config / 항목 점수 컬럼을 추가하세요.",
            );
          }
          const basisOf = (r) =>
            canItemBased ? computeTotal(r, weekId) : (r.total_score ?? null);

          const myBasis = basisOf(s);
          const sorted = scoresForRank
            .map(basisOf)
            .filter((x) => x !== null)
            .sort((a, b) => b - a);
          total_students = sorted.length;
          rank =
            myBasis !== null ? sorted.findIndex((v) => v === myBasis) + 1 : "-";

          // 평균 계산
          let displayAvg = "-";
          const totals = scoresForRank.map(basisOf).filter((x) => x !== null);
          if (totals.length > 0) {
            displayAvg =
              (totals.reduce((a, b) => a + b, 0) / totals.length).toFixed(1) +
              "점";
          }

          // 관리자가 '이번 주 과제 없음'을 체크한 주차는 과제 관련 표시를 전부 숨긴다
          const noHomework = s.no_homework === true;
          // homework_rate가 null이면 미기재 처리
          const hwNull =
            s.homework_rate === null || s.homework_rate === undefined;
          const hwRate = hwNull ? null : s.homework_rate;
          const hwColor =
            hwRate === null
              ? "#6b6b6b"
              : hwRate >= 90
                ? "#27ae60"
                : hwRate >= 70
                  ? "#e67e22"
                  : "#c0392b";
          const hwDisplay = hwRate === null ? "미기재" : hwRate + "%";

          // 결석한 주차는 점수 위에 사유를 먼저 알린다(점수는 그대로 함께 보여줌)
          const absent = isAbsentWeek(s);
          const absentHtml = absent
            ? `
        <div class="notice-card warning">
          <span class="notice-icon" aria-hidden="true"></span>
          <div>
            <div class="notice-title">결석</div>
            <div class="notice-body">이번 주 수업에 결석했습니다.${myTotal === null ? "" : "<br>아래 점수는 보충·재응시 등으로 기록된 점수입니다."}</div>
          </div>
        </div>`
            : "";

          // 과제 수행률별 안내 문구를 대신해 클리닉 안내를 노출한다.
          // 조교가 점수 탭 / 클리닉 문자 탭에서 입력한 scores.clinic_memo를 그대로 전달한다.
          if (s.clinic_memo === undefined) {
            console.warn(
              "[클리닉] 응답에 clinic_memo 컬럼이 없어 클리닉 안내를 표시할 수 없습니다. " +
                "parent-login 함수의 scores select에 clinic_memo를 추가하세요.",
            );
          }
          // 메모가 비어 있으면(= 그 주 클리닉 안내가 없으면) 카드를 아예 그리지 않는다
          const clinicMemo = (s.clinic_memo ?? "").toString().trim();
          const noticeHtml = clinicMemo
            ? `
        <div class="notice-card warning">
          <span class="notice-icon" aria-hidden="true"></span>
          <div>
            <div class="notice-title">클리닉 안내</div>
            <div class="notice-body">${escapeHtml(clinicMemo).replace(/\n/g, "<br>")}</div>
          </div>
        </div>`
            : "";

          content.innerHTML = `
      <div class="card">
        <div class="card-header"><h2>점수 결과</h2></div>
        <div class="card-body">
          ${absentHtml}
          <div class="score-grid items-${itemsForWeek(weekId).length}">
            ${itemsForWeek(weekId)
              .map((it) => itemCellHtml(it, itemVal(s, it.key), s.retest_pass))
              .join("")}
            <div class="score-item total">
              <div class="score-label">총점</div>
              <div><span class="score-value">${myTotal === null ? "-" : myTotal}</span><span class="score-max"> / ${totalMaxForWeek(weekId)}</span></div>
            </div>
          </div>
          <div class="meta-grid">
            <div class="meta-item">
              <div class="meta-label">평균</div>
              <div class="meta-value">${displayAvg}</div>
            </div>
            <div class="meta-item">
              <div class="meta-label">석차</div>
              <div class="meta-value">${rank}등 / ${total_students}명</div>
            </div>
          </div>
          ${
            noHomework
              ? ""
              : `<div class="homework-card">
            <div><div class="homework-label">과제 수행률</div></div>
            <div style="text-align:right">
              <div class="homework-rate" style="color:${hwColor}">${hwDisplay}</div>
            </div>
          </div>`
          }
          ${noticeHtml}
          ${weekReportButtonHtml(weekId)}
          ${weekResultButtonsHtml(weekId)}
        </div>
      </div>`;
        } catch (e) {
          content.innerHTML =
            '<div class="empty-msg">데이터를 불러오는 중 오류가 발생했습니다.</div>';
        }
      }

      function switchTab(tabName) {
        const tabNav = document.getElementById("tab-nav");
        const buttons = tabNav.querySelectorAll(".tab-btn");
        buttons.forEach((btn, i) => {
          btn.classList.toggle("active", (i === 0 && tabName === "scores") || (i === 1 && tabName === "vocab") || (i === 2 && tabName === "passage") || (i === 3 && tabName === "grammar"));
        });

        if (tabName === "vocab" || tabName === "passage" || tabName === "grammar") {
          // 단어·지문·어법 사이트는 같은 도메인의 독립 페이지로 연다. 세션 쿠키가 있어서 다시 로그인하지 않는다
          window.location.href = tabName === "vocab" ? "./vocab/" : "./vocab/?go=" + tabName;
        }
      }

      function logout() {
        Object.keys(_wresCache).forEach((k) => delete _wresCache[k]);
        Object.keys(_paperCache).forEach((k) => delete _paperCache[k]);
        closePaperViewer();
        _wresOpen = null;
        currentStudent = null;
        currentWeeks = [];
        allScores = [];
        loginData = null;
        window._mockScoreMap = {};
        if (chartInstance) {
          chartInstance.destroy();
          chartInstance = null;
        }
        document.getElementById("result-section").style.display = "none";
        document.getElementById("login-section").style.display = "block";
        document.getElementById("summary-grid").style.display = "none";
        document.getElementById("chart-card").style.display = "none";
        document.getElementById("mock-score-section").style.display = "none";
        document.getElementById("mock-score-section").innerHTML = "";
        document.getElementById("clinic-book-card").style.display = "none";
        clinicState = null;
        document.getElementById("input-name").value = "";
        document.getElementById("input-pin").value = "";
        document.getElementById("error-msg").classList.remove("show");
        document.getElementById("tab-nav").classList.remove("show");
        // 서버가 세션 쿠키를 지운다 (실패해도 화면은 이미 로그아웃 상태)
        fetch(PARENT_LOGIN_URL, { method: "DELETE" }).catch(() => {});
      }

      document.getElementById("input-pin").addEventListener("keydown", (e) => {
        if (e.key === "Enter") login();
      });
      document.getElementById("input-name").addEventListener("keydown", (e) => {
        if (e.key === "Enter") document.getElementById("input-pin").focus();
      });
      // 세션 쿠키가 살아 있으면 PIN 없이 성적 화면을 다시 연다
      async function tryResumeSession() {
        const load = document.getElementById("login-loading");
        load.classList.add("show");
        try {
          const res = await fetch(PARENT_LOGIN_URL, { method: "GET" });
          // 401: 만료되었거나 재원 상태가 바뀜 → 로그인 화면으로
          if (!res.ok) return false;
          loginData = await res.json();
          currentStudent = loginData.student;
          await showResult();
          return true;
        } catch (e) {
          return false;
        } finally {
          load.classList.remove("show");
        }
      }
      tryResumeSession().then((resumed) => {
        if (!resumed) document.getElementById("input-name").focus();
      });
    </script>
    <!-- 문제지·답지 보기 창 (틀린 문제 → 문제·정답·해설, 2026-11-23) -->
    <div id="wpv" class="wpv" role="dialog" aria-modal="true"></div>
  </body>
</html>
