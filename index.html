<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>용산대성N학원 [영어과] 점수 확인</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/theme.css" />
    <style>
      .form-group {
        margin-bottom: 12px;
      }
      .form-group label {
        display: block;
        font-size: 11px;
        color: var(--gray);
        font-weight: 500;
        margin-bottom: 5px;
      }
      .form-group input {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid var(--border);
        border-radius: 10px;
        font-size: 16px;
        font-family: "Noto Sans KR", sans-serif;
        color: var(--navy);
        background: var(--cream);
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .form-group input:focus {
        border-color: var(--accent-ink);
        box-shadow: 0 0 0 3px rgba(47, 94, 168, 0.15);
        background: var(--white);
      }
      .btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        font-family: "Noto Sans KR", sans-serif;
        cursor: pointer;
        transition: background-color 0.2s, opacity 0.2s;
      }
      .btn-primary {
        background: var(--navy);
        color: var(--white);
      }
      .btn-primary:hover {
        background: var(--navy-light);
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      /* 클리닉 신청 (2026-11) */
      .cb-current {
        background: var(--accent-light);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 12px;
        font-size: 14px;
        color: var(--navy);
        line-height: 1.6;
      }
      .cb-current b {
        font-size: 16px;
      }
      .cb-pick {
        display: grid;
        grid-template-columns: 1.25fr 1.25fr 0.9fr;
        gap: 6px;
        margin: 8px 0 0;
      }
      .cb-pick .period-select {
        padding: 10px 24px 10px 10px;
        background-position: right 8px center;
        font-size: 14px;
      }
      .cb-pick .period-select:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .cb-chosen {
        font-size: 13.5px;
        color: var(--navy);
        margin-top: 10px;
      }
      .cb-chosen b {
        font-size: 15px;
      }
      .cb-submit {
        width: 100%;
        margin-top: 8px;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: var(--navy);
        color: var(--white);
        font-size: 14.5px;
        font-weight: 700;
        font-family: "Noto Sans KR", sans-serif;
        cursor: pointer;
      }
      .cb-submit:disabled {
        background: var(--border);
        color: var(--gray);
        cursor: default;
      }
      .cb-warn {
        font-size: 12px;
        color: var(--red);
        margin-top: 6px;
      }
      .cb-label {
        font-size: 12.5px;
        color: var(--gray);
        margin-top: 4px;
      }
      .cb-note {
        font-size: 11.5px;
        color: var(--gray);
        line-height: 1.7;
        margin-top: 10px;
      }
      .cb-msg {
        font-size: 13px;
        font-weight: 600;
        margin-top: 10px;
      }
      .cb-msg.ok {
        color: var(--green);
      }
      .cb-msg.err {
        color: var(--red);
      }
      .cb-cancel {
        margin-top: 10px;
        background: none;
        border: none;
        color: var(--red);
        font-size: 12.5px;
        font-weight: 600;
        font-family: "Noto Sans KR", sans-serif;
        text-decoration: underline;
        cursor: pointer;
      }
      /* 시험 모두 통과 + 과제 기준 이상 → 클리닉 없음 (2026-11-22) */
      .cb-exempt {
        background: var(--green-light);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 14px;
        font-weight: 600;
        color: var(--green);
        line-height: 1.6;
      }
      .mock-report-msg {
        font-size: 12px;
        color: var(--red);
        text-align: center;
        margin-top: 8px;
      }
      .mock-report-msg:empty {
        display: none;
      }
      /* 주차 채점 결과 글 (2026-11-22) */
      .wres-btns { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
      .wres-btn { background: var(--accent-light); color: var(--navy); }
      .wres-btn.open { background: var(--navy); color: var(--white); }
      .wres-loading { font-size: 13px; color: var(--gray); text-align: center; padding: 14px 0; }
      .wres-panel { margin-top: 12px; }
      .wres-sum { display: flex; flex-wrap: wrap; gap: 6px 16px; background: var(--cream); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--navy); }
      .wres-sum b { font-size: 16px; }
      .wres-h { font-size: 14px; font-weight: 700; color: var(--navy); margin: 18px 0 8px; }
      .wres-muted { color: var(--gray); font-weight: 500; font-size: 12px; }
      .wres-word, .wres-sent, .wres-detail { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 13.5px; color: var(--navy); line-height: 1.6; background: var(--white); }
      .wres-word.x { border-left: 4px solid var(--red); }
      .wres-word.o { border-left: 4px solid var(--green); }
      .wres-no { display: inline-block; min-width: 24px; font-size: 12px; font-weight: 700; color: var(--gray); margin-right: 4px; }
      .wres-row { display: flex; gap: 8px; margin-top: 4px; }
      .wres-row.col { flex-direction: column; gap: 0; margin-top: 8px; }
      .wres-k { flex: none; min-width: 34px; font-size: 11.5px; font-weight: 600; color: var(--gray); padding-top: 2px; }
      .wres-reason { font-size: 12px; color: var(--gray); margin-top: 4px; }
      .wres-blank { color: var(--gray); }
      .wres-good { font-size: 13px; font-weight: 600; color: var(--green); background: var(--green-light); border-radius: 10px; padding: 10px 12px; }
      .wres-more { margin-top: 6px; }
      .wres-more summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--accent-ink); padding: 8px 0; }
      .wres-sent-top, .wres-detail-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .wres-pts { font-size: 13px; font-weight: 700; color: var(--orange); }
      .wres-pts.full { color: var(--green); }
      .wres-src { font-size: 13px; margin: 6px 0 0; background: var(--cream); border-radius: 8px; padding: 8px 10px; }
      .wres-hint { font-size: 12px; color: var(--gray); margin-top: 10px; }
      .wres-chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .wres-chip { border: 1.5px solid var(--red); background: var(--red-light); color: var(--red); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; font-family: "Noto Sans KR", sans-serif; cursor: pointer; }
      .wres-chip small { font-size: 11px; font-weight: 600; }
      .wres-chip.active { background: var(--red); color: var(--white); }
      .wres-detail { margin-top: 8px; }
      .wres-detail:empty { display: none; }
      .wres-list { margin: 2px 0 0; padding: 0; list-style: none; }
      .wres-list li { padding: 1px 0; }
      .wres-list li.ok { color: var(--green); }
      .wres-list li.x { color: var(--red); }
      .wres-ex { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 6px; }
      .wres-ex summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--accent-ink); padding: 4px 0; }
      .wres-ex .wd-view { font-size: 13.5px; line-height: 1.7; margin-top: 4px; }
      .wres-paper-btns { display: flex; gap: 6px; margin-top: 10px; }
      .wres-paper-btn { flex: 1; border: 1.5px solid var(--accent-ink); background: var(--white); color: var(--accent-ink); border-radius: 8px; padding: 8px 6px; font-size: 13px; font-weight: 700; font-family: "Noto Sans KR", sans-serif; cursor: pointer; }
      .wres-paper-btn:disabled { opacity: 0.5; cursor: default; }
      /* 문제지·답지 보기 창 (docx 본문) */
      .wpv { display: none; position: fixed; inset: 0; z-index: 1000; background: var(--white); flex-direction: column; }
      .wpv.open { display: flex; }
      .wpv-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--navy); color: var(--white); }
      .wpv-head b { font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .wpv-tabs { display: flex; gap: 4px; }
      .wpv-tabs button { border: 1px solid rgba(255, 255, 255, 0.5); background: transparent; color: var(--white); border-radius: 999px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; font-family: "Noto Sans KR", sans-serif; cursor: pointer; }
      .wpv-tabs button.on { background: var(--white); color: var(--navy); }
      .wpv-tabs button:disabled { opacity: 0.4; cursor: default; }
      .wpv-close { border: none; background: transparent; color: var(--white); font-size: 20px; line-height: 1; padding: 4px 6px; cursor: pointer; }
      .wpv-note { font-size: 12px; color: var(--red); font-weight: 600; padding: 8px 14px 0; }
      .wpv-body { flex: 1; overflow: auto; padding: 12px 14px 32px; -webkit-overflow-scrolling: touch; }
      .wpv-sep { font-size: 12px; font-weight: 700; color: var(--accent-ink); margin: 18px 0 6px; padding-top: 10px; border-top: 1px dashed var(--border); }
      .wd-view { font-size: 14.5px; line-height: 1.75; color: var(--navy); word-break: keep-all; overflow-wrap: anywhere; }
      .wd-view .wd-p { margin: 0 0 6px; }
      .wd-view .wd-ch { padding-left: 1.35em; text-indent: -1.35em; }
      .wd-view .wd-box { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 6px 0 10px; }
      .wd-view .wd-box.sh { background: #f2f6fb; }
      .wd-view .wd-tbl { width: 100%; border-collapse: collapse; margin: 6px 0 10px; font-size: 13px; }
      .wd-view .wd-tbl td { border: 1px solid var(--border); padding: 4px 6px; vertical-align: top; }
      .wd-view sup { font-size: 0.68em; color: var(--accent-ink); font-weight: 700; }
      .wd-view u { text-underline-offset: 3px; }
      .btn-secondary {
        background: var(--light-gray);
        color: var(--navy);
        margin-top: 10px;
      }
      .error-msg {
        display: none;
        background: var(--red-light);
        border: 1px solid #f5c6c2;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 13px;
        color: var(--red);
        margin-top: 12px;
        text-align: center;
      }
      .error-msg.show {
        display: block;
      }
      .loading {
        display: none;
        text-align: center;
        padding: 28px;
        color: var(--gray);
        font-size: 13px;
      }
      .loading.show {
        display: block;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid var(--light-gray);
        border-top-color: var(--accent-ink);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 10px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #result-section {
        display: none;
      }
      .student-info {
        background: var(--navy);
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 14px;
        position: relative;
        overflow: hidden;
      }
      .student-name {
        font-size: 22px;
        font-weight: 700;
        color: var(--white);
        margin-bottom: 3px;
      }
      .student-class {
        font-size: 12px;
        color: var(--accent);
      }
      .summary-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 14px;
      }
      .summary-item {
        background: var(--white);
        border: 1.5px solid var(--border);
        border-radius: 12px;
        padding: 13px;
        text-align: center;
      }
      .summary-label {
        font-size: 11px;
        color: var(--gray);
        margin-bottom: 4px;
      }
      .summary-value {
        font-size: 18px;
        font-weight: 700;
        color: var(--navy);
      }
      .chart-wrap {
        padding: 16px 18px 12px;
      }
      .chart-wrap canvas {
        max-height: 180px;
      }
      /* 커트라인 미달 항목 강조 (관리자 화면과 같은 규칙) */
      .score-item.below-cut {
        background: var(--red-light);
        border: 1.5px solid #f5c6c2;
        padding: 11.5px;
      }
      .score-item.below-cut .score-value {
        color: var(--red);
      }
      /* 재시험 표시 */
      .retest-pass {
        display: inline-block;
        margin-top: 3px;
        padding: 2px 7px;
        border-radius: 10px;
        background: var(--green-light);
        color: var(--green);
        font-size: 10px;
        font-weight: 600;
      }
      .retest-target {
        display: inline-block;
        margin-top: 3px;
        padding: 2px 7px;
        border-radius: 10px;
        background: var(--red-light);
        color: var(--red);
        font-size: 10px;
        font-weight: 600;
      }
      .period-select {
        width: 100%;
        padding: 11px 38px 11px 14px;
        border: 1.5px solid var(--border);
        border-radius: 10px;
        font-size: 14px;
        font-family: "Noto Sans KR", sans-serif;
        font-weight: 500;
        color: var(--navy);
        background-color: var(--white);
        /* 기본 화살표 대신 직접 그린 화살표 (브라우저별 모양 통일) */
        background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath d='M1 1.5 6 6.5l5-5' fill='none' stroke='%232f5ea8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: right 14px center;
        background-size: 12px 8px;
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        cursor: pointer;
        outline: none;
        transition: border-color 0.15s;
      }
      .period-select:focus {
        border-color: var(--accent-ink);
      }
      .period-select optgroup {
        font-size: 12px;
        color: var(--gray);
      }
      .period-select option {
        font-size: 14px;
        color: var(--navy);
      }
      .score-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 10px;
      }
      /* 항목 수가 주차마다 다르고 개수 상한이 없으므로(2열 그리드가 알아서 줄바꿈)
         총점은 항상 한 줄 전체를 차지하게 둔다 */
      .score-grid .score-item.total {
        grid-column: 1 / -1;
      }
      /* 항목이 1개뿐인 주차는 그 항목도 전체 폭으로 */
      .score-grid.items-1 .score-item:not(.total) {
        grid-column: 1 / -1;
      }
      .score-item {
        background: var(--light-gray);
        border-radius: 12px;
        padding: 13px;
      }
      .score-item.total {
        grid-column: 1/-1;
        background: var(--navy);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
      }
      .score-label {
        font-size: 11px;
        color: var(--gray);
        font-weight: 500;
        margin-bottom: 5px;
      }
      .score-item.total .score-label {
        color: var(--accent-ink);
        margin: 0;
      }
      .score-value {
        font-size: 22px;
        font-weight: 700;
        color: var(--navy);
      }
      .score-item.total .score-value {
        color: var(--white);
        font-size: 26px;
      }
      .score-max {
        font-size: 12px;
        color: var(--gray);
        font-weight: 400;
      }
      .score-item.total .score-max {
        color: rgba(255, 255, 255, 0.5);
        font-size: 13px;
      }
      .meta-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 10px;
      }
      .meta-item {
        background: var(--white);
        border: 1.5px solid var(--border);
        border-radius: 12px;
        padding: 13px;
        text-align: center;
      }
      .meta-label {
        font-size: 11px;
        color: var(--gray);
        margin-bottom: 3px;
      }
      .meta-value {
        font-size: 15px;
        font-weight: 700;
        color: var(--navy);
      }
      .homework-card {
        background: var(--white);
        border: 1.5px solid var(--border);
        border-radius: 12px;
        padding: 13px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .homework-label {
        font-size: 12px;
        color: var(--gray);
        font-weight: 500;
        margin-bottom: 2px;
      }
      .homework-rate {
        font-size: 20px;
        font-weight: 700;
      }
      .homework-eval {
        font-size: 12px;
        color: var(--gray);
        margin-top: 2px;
        text-align: right;
      }
      .notice-card {
        border-radius: 12px;
        padding: 13px 16px;
        margin-bottom: 10px;
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .notice-card.warning {
        background: var(--orange-light);
        border: 1.5px solid #fad4a8;
      }
      .notice-card.danger {
        background: var(--red-light);
        border: 1.5px solid #f5c6c2;
      }
      .notice-icon {
        width: 8px;
        height: 8px;
        margin-top: 6px;
        border-radius: 50%;
        background: currentColor;
        flex-shrink: 0;
      }
      .notice-card.warning {
        color: var(--orange);
      }
      .notice-card.danger {
        color: var(--red);
      }
      .notice-title {
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 3px;
      }
      .notice-card.warning .notice-title {
        color: var(--orange);
      }
      .notice-card.danger .notice-title {
        color: var(--red);
      }
      .notice-body {
        font-size: 12px;
        line-height: 1.6;
        color: #555;
      }
      ::selection {
        background: var(--accent-light);
        color: var(--navy);
      }
      :focus-visible {
        outline: 2px solid var(--accent-ink);
        outline-offset: 2px;
      }
      .score-value,
      .summary-value,
      .meta-value,
      .homework-rate {
        font-variant-numeric: tabular-nums;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation-duration: 0.01ms !important;
        }
      }
      .empty-msg {
        text-align: center;
        padding: 28px;
        color: var(--gray);
        font-size: 13px;
      }
      footer {
        width: 100%;
        text-align: center;
        padding: 18px;
        font-size: 11px;
        color: var(--gray);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>영어과 <span>성적 관리</span></h1>
      <div class="tab-nav" id="tab-nav">
        <button class="tab-btn active" onclick="switchTab('scores')">점수 확인</button>
        <button class="tab-btn" onclick="switchTab('vocab')">단어 공부</button>
        <button class="tab-btn" onclick="switchTab('passage')">지문 공부</button>
        <button class="tab-btn" onclick="switchTab('grammar')">어법 공부</button>
      </div>
    </header>

    <div class="container">
      <div id="login-section">
        <div class="card">
          <div class="card-header">
            
            <h2>학생 로그인</h2>
          </div>
          <div class="card-body">
            <div class="form-group">
              <label>학생 이름</label>
              <input
                type="text"
                id="input-name"
                placeholder="이름을 입력하세요"
                autocomplete="off"
                lang="ko"
                inputmode="text"
              />
            </div>
            <div class="form-group">
              <label>학부모 연락처 뒷 4자리</label>
              <input
                type="password"
                id="input-pin"
                placeholder="숫자 4자리"
                maxlength="4"
                inputmode="numeric"
              />
            </div>
            <button class="btn btn-primary" onclick="login()">
              점수 확인하기
            </button>
            <div class="error-msg" id="error-msg">
              이름 또는 PIN이 올바르지 않습니다.
            </div>
          </div>
        </div>
        <div class="loading" id="login-loading">
          <div class="spinner"></div>
          확인 중...
        </div>
      </div>

      <div id="result-section">
        <div class="student-info">
          <div class="student-name" id="result-name"></div>
          <div class="student-class" id="result-class"></div>
        </div>

        <!-- 클리닉 신청 (2026-11): 선생님이 정해 둔 시간 중에서 고른다. 변경·취소는 학부모·선생님께 문자(신청은 문자 없음) -->
        <div class="card" id="clinic-book-card" style="display: none">
          <div class="card-header">
            <h2>클리닉 신청</h2>
          </div>
          <div class="card-body" id="clinic-book-body"></div>
        </div>

        <div class="card">
          <div class="card-header">
            
            <h2>주차 선택</h2>

            ></select>

          <div class="empty-msg">주차를 선택해주세요.</div>

        <div class="summary-grid" id="summary-grid" style="display: none">
          <div class="summary-item">

          </div>
          <div class="summary-item">
            <div class="summary-label">최고 점수</div>
            <div class="summary-value" id="cum-best">-</div>
          </div>

        <div class="card" id="chart-card" style="display: none">

            <h2>점수 추이</h2>

          </div>

        <button class="btn btn-secondary" onclick="logout()">
